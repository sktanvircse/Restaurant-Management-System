version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: spice_garden_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: restaurant_db
      MYSQL_USER: restaurant_user
      MYSQL_PASSWORD: restaurant_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spice_garden_api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "mysql://restaurant_user:restaurant_password@mysql:3306/restaurant_db"
      JWT_ACCESS_SECRET: "spice_garden_super_secret_access_key_2026_xyz123"
      JWT_REFRESH_SECRET: "spice_garden_super_secret_refresh_key_2026_abc456"
      JWT_ACCESS_EXPIRY: "15m"
      JWT_REFRESH_EXPIRY: "7d"
      CORS_ORIGIN: "http://localhost:3000,http://localhost:3002"
      SSLCOMMERZ_STORE_ID: "spicegarden_sandbox"
      SSLCOMMERZ_STORE_PASS: "spicegarden_sandbox@ssl"
      SSLCOMMERZ_IS_LIVE: "false"
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  web-admin:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    container_name: spice_garden_web_admin
    restart: always
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
      NEXT_PUBLIC_SOCKET_URL: "http://localhost:5000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

  web-customer:
    build:
      context: ./web-customer
      dockerfile: Dockerfile
    container_name: spice_garden_web_customer
    restart: always
    environment:
      PORT: 3002
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
      NEXT_PUBLIC_SOCKET_URL: "http://localhost:5000"
    ports:
      - "3002:3002"
    depends_on:
      - backend

volumes:
  mysql_data:
